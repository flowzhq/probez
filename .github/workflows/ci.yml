name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Every source file is text a search can read
        run: |
          # One NUL byte makes grep treat a whole file as binary: it reports no matches and exits 1,
          # which means "not found" and not "could not look". Every check below this one is a grep
          # over src/, so a single stray control byte switches them all off at once -- a file that
          # imports child_process and calls execSync passes every constraint in this job. This runs
          # first so the greps that follow are reading what they think they are reading.
          #
          # \0 is a deliberate key separator in this codebase. Write it as an escape, never as a
          # raw byte: `${a}\0${b}` in a template, '\x00' where a digit follows.
          bad=0
          git ls-files '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.md' '*.yml' '*.html' '*.css' |
            while IFS= read -r file; do
              if [ "$(wc -c < "$file")" != "$(tr -d '\000' < "$file" | wc -c)" ]; then
                echo "$file contains a NUL byte"
                exit 1
              fi
            done || bad=1
          if [ "$bad" = 1 ]; then
            echo "a source file with a NUL byte is invisible to grep, including the checks below"
            exit 1
          fi
          echo "ok: every source file is searchable"

      - name: No runtime dependencies
        run: |
          if node -e "const p=require('./package.json');process.exit(Object.keys(p.dependencies||{}).length?1:0)"; then
            echo "ok: no dependencies"
          else
            echo "probez must have zero runtime dependencies"; exit 1
          fi

      - name: No outbound network
        run: |
          # probez never opens a connection to anything. `view` listens, on loopback only, which is
          # why node:http is not on this list and node:https still is.
          #
          # `fetch` is matched as a call rather than as a word: `git fetch` is in the command table
          # in classify.ts, and a bare \bfetch\b fails this job on a string that is nothing but the
          # name of a git subcommand.
          if grep -arnE "(^|[^'\"[:alnum:]_])fetch[[:space:]]*\(" src/; then
            echo "probez must not make outbound network calls"; exit 1
          fi
          if grep -arnE "\b(XMLHttpRequest|node:https|node:net|node:dgram|node:tls|node:dns|execSync|spawnSync)\b" src/; then
            echo "probez must not make outbound network calls"; exit 1
          fi
          echo "ok: no outbound client"

      - name: The server listens on loopback only
        run: |
          if ! grep -q "^const HOST = '127\.0\.0\.1'$" src/serve.ts; then
            echo "src/serve.ts must bind the loopback address"; exit 1
          fi
          if grep -rn "\.listen(" src/ | grep -vE "\.listen\([^,]+, HOST\)"; then
            echo "every listener must pass HOST, which is 127.0.0.1"; exit 1
          fi
          echo "ok: loopback only"

      - name: Only the opener and the reader touch child_process
        run: |
          # Two files start a program, and they are the only two.
          #
          # src/open.ts opens a browser: one spawn of one platform command with the URL as an argv
          # element. src/reader.ts runs the command a person wrote into reader.json, which is how
          # `probez explain` hands one question to a model they already have -- see CONTRIBUTING
          # rule 2. Anywhere else, or through a shell, is a way to run something nobody asked for.
          if grep -rln "child_process" src/ | grep -vE "^src/(open|reader)\.ts$"; then
            echo "child_process belongs in src/open.ts and src/reader.ts and nowhere else"; exit 1
          fi
          if grep -nE "exec\(|execFile|shell:\s*true" src/open.ts src/reader.ts; then
            echo "these must spawn argv directly, never through a shell"; exit 1
          fi
          echo "ok: two spawns, both argv-only"

      - name: Only the reflog reader looks inside a repository
        run: |
          # probez reads the agent's session files and one file beside the work: git's HEAD reflog,
          # for the commit a task started from. That read lives in src/git.ts, is read-only, and
          # starts no `git` process. A second reader anywhere else is a constraint changing.
          # `\b` keeps this off `.gitignore` and `.github`, which are names in the tool tables.
          if grep -rlnE "\.git\b" src/ | grep -v "^src/git\.ts$"; then
            echo "reading a repository belongs in src/git.ts and nowhere else"; exit 1
          fi
          echo "ok: one reader, read-only"

      - name: The view loads nothing from off-origin
        run: |
          if grep -rnE "(fetch|src|href)\s*[=(]\s*['\"\`]https?://" web/src web/index.html; then
            echo "the view must load only from its own origin: no CDN, no remote fonts"; exit 1
          fi
          echo "ok: same-origin only"
